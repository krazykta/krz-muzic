# GitHub Actions: cada vez que subes cambios de la carpeta android/,
# GitHub alquila un ordenador, compila el APK y lo publica en "Releases"
# con un enlace fijo para descargarlo desde el móvil.
name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write         # necesario para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk krz-muzic.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: krz-muzic-apk
          path: krz-muzic.apk

      - name: Publicar en Releases (enlace fijo)
        uses: ncipollo/release-action@v1
        with:
          tag: apk
          name: KRZ Muzic (APK)
          body: |
            Última versión del APK de KRZ Muzic (compilación ${{ github.run_number }}).
            Descárgalo desde el móvil e instálalo. Se actualiza sola cada vez que hay cambios en la app Android.
          artifacts: krz-muzic.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
